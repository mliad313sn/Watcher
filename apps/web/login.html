<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <script>try{var t=localStorage.getItem('watcher.theme');if(t==='light'||t==='dark')document.documentElement.dataset.theme=t;}catch(e){}</script>
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="icon" href="/icon-192.png" type="image/png" />
  <meta name="theme-color" content="#051424" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>Sign in · Watcher</title>
  <link rel="stylesheet" href="/src/styles.css" />
</head>
<body>
  <div style="min-height:100vh;display:grid;place-items:center">
    <form id="login" class="card" style="width:340px;padding:28px">
      <div class="row" style="justify-content:center;margin-bottom:6px;gap:10px">
        <span class="material-symbols-outlined" style="color:var(--accent);font-size:28px">shield</span>
        <strong style="font-size:22px;color:var(--text-head);letter-spacing:-0.01em">Watcher</strong>
      </div>
      <div class="label-caps" style="text-align:center;margin-bottom:18px">Enterprise Console</div>
      <label for="username">Username</label>
      <input id="username" autocomplete="username" required />
      <label for="password">Password</label>
      <input id="password" type="password" autocomplete="current-password" required />
      <div id="error" style="color:var(--critical);font-size:12px;margin-top:10px;min-height:16px"></div>
      <button class="btn primary" style="width:100%;justify-content:center;margin-top:8px">Sign in</button>
    </form>
  </div>
  <script type="module" src="/src/pages/login.js"></script>
</body>
</html>
