<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Acknowledge · Watcher</title>
  <link rel="stylesheet" href="/src/styles.css" />
  <style>
    body { display: grid; place-items: center; min-height: 100vh; padding: 20px; }
    .ack {
      width: 100%; max-width: 440px; background: var(--bg-raised);
      border: 1px solid var(--border); border-radius: 14px; padding: 22px 20px 24px;
    }
    .ack .brand { display: flex; align-items: center; gap: 9px; justify-content: center; margin-bottom: 18px; }
    .ack .brand strong { font-size: 17px; color: var(--text-head); letter-spacing: -0.01em; }
    .ack h1 { font-size: 20px; margin: 0 0 4px; }
    .ack .sub { color: var(--text-dim); font-size: 13px; }
    .ack .obj { font-family: var(--mono); font-size: 15px; color: var(--text-head); margin-top: 4px; word-break: break-word; }
    .ack .msg {
      font-family: var(--mono); font-size: 13px; color: var(--text-dim); background: var(--bg-deep);
      border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 10px 12px; margin: 14px 0 18px;
      word-break: break-word; line-height: 1.5;
    }
    .ack .big {
      width: 100%; justify-content: center; font-size: 16px; padding: 14px; border-radius: 10px;
    }
    .ack .done { text-align: center; padding: 10px 0; }
    .ack .done .material-symbols-outlined { font-size: 44px; }
    .ack .meta { display: flex; gap: 8px; align-items: center; margin: 12px 0; flex-wrap: wrap; }
    .center { text-align: center; }
  </style>
</head>
<body>
  <div class="ack" id="card">
    <div class="brand">
      <span class="material-symbols-outlined" style="color:var(--accent)">shield</span>
      <strong>Watcher</strong>
    </div>
    <div id="body" class="center dim mono" style="font-size:13px;padding:20px 0">Loading alert…</div>
  </div>
  <script type="module" src="/src/pages/ack.js"></script>
</body>
</html>
