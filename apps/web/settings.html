<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Settings · Watcher</title>
  <link rel="stylesheet" href="/src/styles.css" />
</head>
<body>
  <w-shell active="settings" title="Settings">
    <div class="page-head"><h1>Administration</h1></div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:start">
      <div class="card">
        <h2>Users &amp; roles</h2>
        <form id="user-form">
          <label for="u-name">Username</label>
          <input id="u-name" required />
          <label for="u-pass">Password (min 8 chars)</label>
          <input id="u-pass" type="password" minlength="8" required />
          <label for="u-role">Role</label>
          <select id="u-role">
            <option value="viewer">Viewer — read-only dashboards</option>
            <option value="operator">Operator — ack, downtime, edit devices</option>
            <option value="admin">Admin — full control</option>
          </select>
          <div id="u-msg" style="min-height:18px;font-size:12px;margin-top:8px"></div>
          <button class="btn primary">Create user</button>
        </form>
      </div>

      <div class="card">
        <h2>Network discovery</h2>
        <form id="disc-form">
          <label for="d-cidr">CIDR to scan</label>
          <input id="d-cidr" placeholder="10.0.0.0/24" pattern="^\d{1,3}(\.\d{1,3}){3}/\d{1,2}$" required />
          <div id="d-msg" style="min-height:18px;font-size:12px;margin-top:8px"></div>
          <button class="btn primary">Start discovery</button>
        </form>
        <table class="data" style="margin-top:14px">
          <thead><tr><th>CIDR</th><th>Status</th><th>Last run</th><th>Result</th></tr></thead>
          <tbody id="jobs"></tbody>
        </table>
      </div>
    </div>

    <div class="card" style="margin-top:16px">
      <div class="row" style="justify-content:space-between;align-items:flex-end">
        <div>
          <h2 style="margin-bottom:2px">On-call schedules</h2>
          <div class="dim" style="font-size:13px">Escalations page <em>whoever is on call now</em> — rotations hand off automatically.</div>
        </div>
      </div>
      <div id="oncall-list" style="margin:16px 0"></div>

      <details style="border-top:1px solid var(--border);padding-top:14px">
        <summary style="cursor:pointer;font-size:13px;color:var(--text-dim)">＋ New rotation</summary>
        <form id="oncall-form" style="margin-top:12px;max-width:560px">
          <div class="row" style="gap:12px;align-items:flex-end">
            <div class="grow">
              <label for="oc-name">Schedule name</label>
              <input id="oc-name" placeholder="NOC rotation" required />
            </div>
            <div>
              <label for="oc-interval">Rotation</label>
              <select id="oc-interval" style="width:150px">
                <option value="86400">Daily</option>
                <option value="604800" selected>Weekly</option>
                <option value="1209600">Fortnightly</option>
              </select>
            </div>
          </div>
          <label for="oc-people">Responders (one per line, in rotation order)</label>
          <textarea id="oc-people" rows="3" placeholder="Dana&#10;Sam&#10;Amara" style="font-family:var(--mono);font-size:13px" required></textarea>
          <div id="oc-msg" style="min-height:18px;font-size:12px;margin-top:8px"></div>
          <button class="btn primary">Create rotation</button>
        </form>
      </details>
    </div>
  </w-shell>
  <script type="module" src="/src/pages/settings.js"></script>
</body>
</html>
