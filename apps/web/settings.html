<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Settings · Watcher</title>
  <link rel="stylesheet" href="/src/styles.css" />
</head>
<body>
  <w-shell active="settings" title="Settings">
    <div class="page-head"><h1>Administration</h1></div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:start">
      <div class="card">
        <h2>Users &amp; roles</h2>
        <form id="user-form">
          <label for="u-name">Username</label>
          <input id="u-name" required />
          <label for="u-pass">Password (min 8 chars)</label>
          <input id="u-pass" type="password" minlength="8" required />
          <label for="u-role">Role</label>
          <select id="u-role">
            <option value="viewer">Viewer — read-only dashboards</option>
            <option value="operator">Operator — ack, downtime, edit devices</option>
            <option value="admin">Admin — full control</option>
          </select>
          <div id="u-msg" style="min-height:18px;font-size:12px;margin-top:8px"></div>
          <button class="btn primary">Create user</button>
        </form>
      </div>

      <div class="card">
        <h2>Network discovery</h2>
        <form id="disc-form">
          <label for="d-cidr">CIDR to scan</label>
          <input id="d-cidr" placeholder="10.0.0.0/24" pattern="^\d{1,3}(\.\d{1,3}){3}/\d{1,2}$" required />
          <div id="d-msg" style="min-height:18px;font-size:12px;margin-top:8px"></div>
          <button class="btn primary">Start discovery</button>
        </form>
        <table class="data" style="margin-top:14px">
          <thead><tr><th>CIDR</th><th>Status</th><th>Last run</th><th>Result</th></tr></thead>
          <tbody id="jobs"></tbody>
        </table>
      </div>
    </div>
  </w-shell>
  <script type="module" src="/src/pages/settings.js"></script>
</body>
</html>
