# Serves the built multi-page UI and reverse-proxies the API + WebSocket, so
# the browser talks to a single origin (no CORS, no dev proxy).
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Long-cache fingerprinted assets; they never change under a given name.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # REST API → the Fastify service. Kept as one upstream so /api and /ws share it.
  location /api/ {
    proxy_pass http://api:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Live event stream (WebSocket) → same service, with upgrade headers.
  location /ws {
    proxy_pass http://api:8080;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_read_timeout 3600s;
  }

  # Clean URLs: "/devices" → devices.html; unknown paths fall back to the
  # dashboard (the app has no client-side router, so this is a soft 404 home).
  location / {
    try_files $uri $uri.html $uri/ /index.html;
  }
}
