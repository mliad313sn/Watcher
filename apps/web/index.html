<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Dashboard · Watcher</title>
  <link rel="stylesheet" href="/src/styles.css" />
</head>
<body>
  <w-shell active="dashboard" title="Network Operations">
    <div class="page-head">
      <div>
        <h1>Global Health Dashboard</h1>
        <div class="sub">Real-time telemetry and infrastructure status</div>
      </div>
      <button class="btn mono" id="refresh-note" style="font-size:12px">
        <span class="material-symbols-outlined">refresh</span>Auto-refresh: 30s
      </button>
    </div>
    <!-- Guided first-run: shown only when the operations centre is empty -->
    <div id="firstrun" hidden></div>

    <!-- Demo banner: shown only when a demo environment is loaded -->
    <div id="demobanner" hidden></div>

    <div id="live">
    <div class="tiles" id="tiles" style="margin-bottom:8px"></div>

    <div class="dash-grid" id="grid" style="margin-bottom:16px">
      <div class="widget" style="grid-column:1 / span 3;grid-row:1 / span 3">
        <div class="w-title">Avg CPU (monitored servers)</div>
        <div class="w-body"><w-gauge id="g-cpu" value="0" label="" unit="%"></w-gauge></div>
      </div>
      <div class="widget" style="grid-column:4 / span 3;grid-row:1 / span 3">
        <div class="w-title">Service health</div>
        <div class="w-body"><w-heatmap id="heatmap"></w-heatmap></div>
      </div>
      <div class="widget" style="grid-column:7 / span 6;grid-row:1 / span 3">
        <div class="w-title">Live events</div>
        <div class="w-body"><w-eventfeed id="feed" max="60"></w-eventfeed></div>
      </div>
      <div class="widget" style="grid-column:1 / span 12;grid-row:4 / span 4">
        <div class="w-title">Active problems</div>
        <div class="w-body"><w-statusgrid id="problems"></w-statusgrid></div>
      </div>
    </div>
    </div>
  </w-shell>
  <script type="module" src="/src/pages/dashboard.js"></script>
</body>
</html>
