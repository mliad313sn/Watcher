name: watcher

# Hardened defaults (issue #7):
#  - datastore ports are bound to 127.0.0.1 only (not the world),
#  - Redis requires a password,
#  - all credentials come from .env (see .env.example) with weak fallbacks
#    that MUST be overridden in production,
#  - images are pinned.
# Compose auto-loads .env from the project root.

services:
  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:-watcher}"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-watcher}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  postgres:
    image: postgres:16.6-alpine
    environment:
      POSTGRES_DB: watcher
      POSTGRES_USER: ${PG_USER:-watcher}
      POSTGRES_PASSWORD: ${PG_PASSWORD:-watcher}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pg-data:/var/lib/postgresql/data
      - ./infra/sql/postgres:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PG_USER:-watcher}"]
      interval: 5s
      timeout: 3s
      retries: 10

  timescaledb:
    image: timescale/timescaledb:2.17.2-pg16
    environment:
      POSTGRES_DB: watcher_metrics
      POSTGRES_USER: ${TSDB_USER:-watcher}
      POSTGRES_PASSWORD: ${TSDB_PASSWORD:-watcher}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - tsdb-data:/var/lib/postgresql/data
      - ./infra/sql/timescale:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${TSDB_USER:-watcher}"]
      interval: 5s
      timeout: 3s
      retries: 10

  nagios:
    build: ./infra/nagios
    ports:
      - "8081:80"
    volumes:
      # Shared with the API container/host so the connector can read status.dat
      # and write to the external command pipe.
      - nagios-var:/usr/local/nagios/var
      - ./infra/nagios/objects:/usr/local/nagios/etc/objects/watcher:ro

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    env_file: .env
    environment:
      PG_HOST: postgres
      TSDB_HOST: timescaledb
      TSDB_PORT: "5432"
      REDIS_URL: redis://:${REDIS_PASSWORD:-watcher}@redis:6379
      NAGIOS_STATUS_FILE: /nagios-var/status.dat
      NAGIOS_COMMAND_FILE: /nagios-var/rw/nagios.cmd
      # The browser reaches the product through the web service (single origin),
      # so ack links and CORS point there.
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:8088}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8088}
    ports:
      - "8080:8080"
    volumes:
      - nagios-var:/nagios-var
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      timescaledb:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    # Single browsable origin: serves the built UI and proxies /api + /ws to the
    # api service. Open http://localhost:8088 to reach the whole product.
    ports:
      - "8088:80"
    depends_on:
      - api

  poller:
    build:
      context: .
      dockerfile: apps/poller/Dockerfile
    env_file: .env
    environment:
      PG_HOST: postgres
      TSDB_HOST: timescaledb
      TSDB_PORT: "5432"
      REDIS_URL: redis://:${REDIS_PASSWORD:-watcher}@redis:6379
    depends_on:
      redis:
        condition: service_healthy
      timescaledb:
        condition: service_healthy

volumes:
  redis-data:
  pg-data:
  tsdb-data:
  nagios-var:
