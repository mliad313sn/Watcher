# Example Watcher-managed Nagios objects.
# In production these files are generated from the Postgres device inventory
# (devices.name == host_name) by a config-render job, then Nagios is reloaded
# via the external command file (RESTART_PROGRAM) or SIGHUP.

define host {
    name                    watcher-host
    register                0
    check_command           check-host-alive
    max_check_attempts      3
    check_interval          1
    retry_interval          1
    check_period            24x7
    notification_interval   30
    notification_period     24x7
    contact_groups          admins
}

define host {
    use                     watcher-host
    host_name               core-sw-01
    alias                   Core Switch 01
    address                 192.0.2.10
}

define host {
    use                     watcher-host
    host_name               edge-fw-01
    alias                   Edge Firewall
    address                 192.0.2.1
}

# Parent/child mirrors devices.parent_id — Nagios uses it for reachability
# (UNREACHABLE vs DOWN) and Watcher uses it for alert dependency suppression.
define host {
    use                     watcher-host
    host_name               app-srv-01
    alias                   Application Server 01
    address                 192.0.2.20
    parents                 core-sw-01
}

define service {
    use                     generic-service
    host_name               app-srv-01
    service_description     HTTP
    check_command           check_http
    check_interval          2
}

define service {
    use                     generic-service
    host_name               app-srv-01
    service_description     SSH
    check_command           check_ssh
    check_interval          5
}
